name: Sync Dependabot Generated Artifacts

on:
  workflow_run:
    workflows:
      - Build Dependabot Generated Artifacts
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Resolve eligible pull request
        id: pr
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            let pullNumber = Number(process.env.PR_NUMBER);
            if (!pullNumber && process.env.WORKFLOW_HEAD_SHA) {
              const { data: associatedPullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: process.env.WORKFLOW_HEAD_SHA,
              });
              pullNumber = associatedPullRequests.find((pullRequest) => pullRequest.base.ref === 'main')?.number ?? 0;
            }

            if (!pullNumber) {
              core.setOutput('allowed', 'false');
              core.notice('The completed workflow was not associated with a pull request targeting main.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const headRepository = pullRequest.head.repo?.full_name;
            const eligible =
              pullRequest.user.login === 'dependabot[bot]' &&
              pullRequest.state === 'open' &&
              pullRequest.base.ref === 'main' &&
              headRepository === `${owner}/${repo}` &&
              pullRequest.head.ref.startsWith('dependabot/') &&
              pullRequest.draft === false &&
              pullRequest.labels.some((label) => label.name === 'safe-to-automerge');

            core.setOutput('allowed', String(eligible));
            core.setOutput('number', String(pullRequest.number));
            core.setOutput('head_ref', pullRequest.head.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

            if (!eligible) {
              core.notice(`Pull request #${pullRequest.number} is not an eligible Dependabot PR.`);
            }

      - name: Download generated artifact
        if: steps.pr.outputs.allowed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dependabot-generated
          path: .dependabot-generated
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SBOM
        if: steps.pr.outputs.allowed == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');

            const metadata = JSON.parse(
              fs.readFileSync('.dependabot-generated/metadata.json', 'utf8'),
            );
            const pullNumber = Number(process.env.PR_NUMBER);
            const expectedHeadRef = process.env.PR_HEAD_REF;
            const expectedHeadSha = process.env.PR_HEAD_SHA;

            if (
              metadata.pr_number !== pullNumber ||
              metadata.head_ref !== expectedHeadRef ||
              metadata.head_sha !== expectedHeadSha
            ) {
              throw new Error('Generated artifact metadata does not match the current pull request head.');
            }

            if (!metadata.changed) {
              core.info('No generated artifact changes require synchronization.');
              return;
            }

            const path = 'dist/securezip-sbom.cdx.json';
            const content = fs.readFileSync(
              '.dependabot-generated/securezip-sbom.cdx.json',
            );
            const { owner, repo } = context.repo;
            const branchRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${expectedHeadRef}`,
            });

            if (branchRef.data.object.sha !== expectedHeadSha) {
              throw new Error('Dependabot branch changed while the artifact was being synchronized; retrying is required.');
            }

            const current = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: expectedHeadRef,
            });

            if (Array.isArray(current.data)) {
              throw new Error(`${path} resolved to a directory`);
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'ci: Dependabotの生成済みSBOMを同期',
              content: content.toString('base64'),
              branch: expectedHeadRef,
              sha: current.data.sha,
              committer: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com',
              },
              author: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com',
              },
            });

            core.info(`Updated ${path} on ${expectedHeadRef}.`);
