name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Set up npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity gate)
        run: npm audit --audit-level=high --omit=dev

      - name: Run npm audit signatures
        run: npm audit signatures --omit=dev

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

  package:
    name: package
    runs-on: ubuntu-latest
    needs: static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Set up npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX bundle
        run: npm run package

      - name: Package preflight (vsce)
        run: npm run package:verify

      - name: Verify generated SBOM
        run: |
          set -euo pipefail
          test -s dist/securezip-sbom.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5"' \
            dist/securezip-sbom.cdx.json >/dev/null
          echo "Generated SBOM is valid and ready for packaging."

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Set up npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Set up npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.0

      - name: Install dependencies
        run: npm ci

      - name: Run extension integration tests
        run: xvfb-run -a npm run test
